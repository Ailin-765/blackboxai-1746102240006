<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Juego 3D Virus Zombie</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Roboto', sans-serif;
      background-color: #111827; /* Tailwind gray-900 */
      color: #f9fafb; /* Tailwind gray-50 */
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: #1f2937; /* Tailwind gray-800 */
    }
    .ui-overlay {
      position: absolute;
      top: 1rem;
      left: 1rem;
      z-index: 10;
      max-width: 320px;
      background: rgba(31, 41, 55, 0.85);
      padding: 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.7);
    }
    button {
      background-color: #2563eb; /* Tailwind blue-600 */
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-weight: 700;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #1d4ed8; /* Tailwind blue-700 */
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div class="ui-overlay" id="uiOverlay">
    <h1 class="text-xl font-bold mb-2">Juego 3D Virus Zombie</h1>
    <div id="gameText" class="mb-4">
      Bienvenido al juego. Resuelve el rompecabezas para comenzar.
    </div>
    <button id="startButton">Comenzar</button>
  </div>
  <script src="main.js"></script>
</body>
</html>
